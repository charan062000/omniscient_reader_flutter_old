name: omniscient_reader
description: "All-in-one Comic, Manga, EPUB and Novel Reader"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8

  # File Picker: Allows selecting CBZ, EPUB, and PDF files from phone storage
  file_picker: ^8.0.0

  # Archive: Extracts CBZ and ZIP comic files to view images
  archive: ^3.5.0

  # Paths: Finds phone directories to save bookmarks, covers, and downloads
  path_provider: ^2.1.2
  path: ^1.9.0

  # Database: SQLite for your Library (CRUD operations, history, bookmarks)
  sqflite: ^2.3.0

  # Permissions: Asks user for storage permissions on Android
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
